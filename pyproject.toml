[project]
name = "polyrepo-template"
version = "0.1.0"
description = "Manifest-driven synchronization for polyrepo development workspaces"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = ["pyyaml>=6.0.2,<7"]

[project.scripts]
polyrepo-sync = "polyrepo.sync_repo:main"

[build-system]
requires = ["uv-build>=0.11.28,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "polyrepo"
